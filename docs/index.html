  <body style="background:#0b1020;color:#eef3ff;margin:0;">
    <div id="root"></div>
    <script>
      window.__loadStaticNusa = function () {
        if (window.__NUSA_MOUNTED__ || window.__NUSA_STATIC_LOADING__) return;
        window.__NUSA_STATIC_LOADING__ = true;
        var base = document.createElement('base');
        base.href = './docs/';
        document.head.appendChild(base);
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = './assets/nusa-app.css';
        document.head.appendChild(link);
        var script = document.createElement('script');
        script.type = 'module';
        script.src = './assets/nusa-app.js';
        document.body.appendChild(script);
      };
      setTimeout(function () {
        if (!window.__NUSA_MOUNTED__) window.__loadStaticNusa();
      }, 600);
    </script>
  </body>
